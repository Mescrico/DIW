<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contacto · RAÍZ</title>
    <link rel="stylesheet" href="/src/tailwind.css" />
  </head>
  <body class="bg-fondo text-texto min-h-screen flex flex-col">
    <!-- ✍️ B3 · Esta página va SOLO con Tailwind (src/tailwind.css), sin SASS. Ponle las clases de utilidad:
         los colores de RAÍZ (del @theme), dos columnas desde md y un botón con hover: y focus-visible:.
         Nada de valores sueltos entre corchetes ni style="". -->
    <header class="bg-tierra flex justify-between px-5 py-3 border-b-2 font-bold">
      <a href="/">RAÍZ</a>
      <nav aria-label="Principal" class="flex flex-row gap-7 underline">
        <a href="/">Inicio</a>
        <a href="/producto.html">Monstera</a>
        <a href="/contacto.html" aria-current="page">Contacto</a>
      </nav>
    </header>

    <main class="px-5 py-6 flex-grow bg-fondo">
      <h1 class="font-bold text-2xl mb-30 text-tierra">Contacto</h1>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-5xl mx-auto">
        <section
          aria-label="Dónde estamos"
          class="flex flex-col justify-between h-full p-6 bg-marca-suave border-2 border-marca rounded-md"
        >
          <div class="flex flex-col gap-3">
            <h2 class="text-xl font-bold text-marca">El vivero</h2>
            <p class="text-texto">
              Abrimos de lunes a sábado, de 9:00 a 14:00. Si vienes en persona, te ayudamos a elegir.
            </p>
          </div>
          <p class="text-tierra font-medium">Envíos gratis desde 40 €</p>
        </section>

        <form
          action="#"
          class="px-4 py-3 flex flex-col gap-2 justify-between bg-marca-suave border-2 border-marca rounded-md"
        >
          <label for="nombre" class="flex flex-col gap-1 font-semibold">
            Nombre
            <input id="nombre" name="nombre" autocomplete="name" required class="bg-fondo border border-texto" />
          </label>
          <label for="correo" class="flex flex-col gap-1 font-semibold">
            Correo
            <input
              id="correo"
              name="correo"
              type="email"
              autocomplete="email"
              required
              class="bg-fondo border border-texto"
            />
          </label>
          <label for="mensaje" class="flex flex-col gap-1 font-semibold">
            ¿En qué te ayudamos?
            <textarea id="mensaje" name="mensaje" rows="4" required class="bg-fondo border border-texto"></textarea>
          </label>
          <button
            type="submit"
            class="p-3 bg-tierra border-2 border-black text-xl text-white rounded-md font-semibold hover:bg-marca hover:text-black focus-visible:bg-marca focus-visible:text-black"
          >
            Enviar
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-tierra px-6 py-4 border-t-2">RAÍZ, vivero online · Cádiz</footer>
  </body>
</html>
